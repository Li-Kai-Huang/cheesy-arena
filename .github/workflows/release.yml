name: Create Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build Multi-Platform Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.0"
          fi
          echo "VERSION=${TAG_NAME#v}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Build Bundles for Platforms
        run: |
          VERSION="${{ env.VERSION }}"
          ASSETS="LICENSE README.md font schedules static switch_config.txt templates tunnel"

          build_platform() {
            local zip_name="$1"
            local target_os="$2"
            local target_arch="$3"
            local bin_name="$4"

            rm -rf cheesy-arena
            mkdir cheesy-arena
            GOOS="$target_os" GOARCH="$target_arch" go build -o "cheesy-arena/$bin_name" .
            for item in $ASSETS; do [ -e "$item" ] && cp -r "$item" cheesy-arena/; done
            zip -r -X "$zip_name" cheesy-arena
            rm -rf cheesy-arena
          }

          # Build for all 4 platforms
          build_platform "cheesy-arena.${VERSION}.linux.x64.zip" "linux" "amd64" "cheesy-arena"
          build_platform "cheesy-arena.${VERSION}.macos.x64.zip" "darwin" "amd64" "cheesy-arena"
          build_platform "cheesy-arena.${VERSION}.macos.arm64.zip" "darwin" "arm64" "cheesy-arena"
          build_platform "cheesy-arena.${VERSION}.windows.x64.zip" "windows" "amd64" "cheesy-arena.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Cheesy Arena ${{ env.TAG_NAME }}
          body: |
            ## Cheesy Arena Release ${{ env.TAG_NAME }}

            Pre-built automated binary packages for Windows, macOS (Intel & Apple Silicon), and Linux.

            ### Download Packages:
            - `cheesy-arena.${{ env.VERSION }}.windows.x64.zip` (Windows 64-bit)
            - `cheesy-arena.${{ env.VERSION }}.macos.arm64.zip` (macOS Apple Silicon M1/M2/M3)
            - `cheesy-arena.${{ env.VERSION }}.macos.x64.zip` (macOS Intel 64-bit)
            - `cheesy-arena.${{ env.VERSION }}.linux.x64.zip` (Linux 64-bit)
          files: |
            cheesy-arena.*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
