# Config file for Air (https://github.com/air-verse/air)

root = "."
tmp_dir = "tmp"

[build]
# Build command for Windows
cmd = "go build -o ./tmp/cheesy-arena.exe ."
# Binary location produced by `cmd`
bin = "tmp/cheesy-arena.exe"
# Command to execute binary on Windows
full_bin = ".\\tmp\\cheesy-arena.exe"
# Watch these filename extensions
include_ext = ["go", "html", "css", "js", "sql"]
# Exclude directories from watching
exclude_dir = ["tmp", ".git", ".github", "coverage", "schedules"]
# Stop running old binary when build errors occur
stop_on_error = true
# Send interrupt signal before killing process
send_interrupt = true
kill_delay = "1s"

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
